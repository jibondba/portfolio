name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-24.04

    steps:
      - name: Deploy Website
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            /opt/portfolio/deploy.sh
